[plugin]
name="LiteTerrain"
description="Lightweight heightmap terrain for mobile: one node builds a StaticBody3D with HeightMapShape3D collision and an ArrayMesh, with quadtree LOD and streaming collision. Configurable biomes in a single resource, sculpt brushes, noise generation, R32F/mesh baking and PNG heightmap export."
author="MrKrob"
version="1.2"
script="plugin.gd"
